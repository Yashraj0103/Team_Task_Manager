<!DOCTYPE html>
<html>
<head>
  <title>Project Tasks</title>
  <style>
    body {
      margin: 0;
      font-family: Poppins;
      background: #020617;
      color: white;
    }

    .container {
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .task-input {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .task-input input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #0f172a;
      color: white;
    }

    .task-input button {
      padding: 12px 20px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    .task-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-card:hover {
      border-color: #3b82f6;
    }

    .status {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
    }

    .pending { background: #1e293b; }
    .done { background: #16a34a; }
  </style>
</head>

<body>

<div class="container">

  <h1>Project Tasks</h1>

  <div class="task-input">
  <input id="taskTitle" placeholder="Task name">

  <select id="assignUser">
    <option value="">Assign user</option>
  </select>

  <button onclick="createTask()">Add</button>
</div>

<div id="taskList"></div>

<script>
const params = new URLSearchParams(window.location.search);
const projectId = params.get("id");

async function loadTasks() {
  const res = await fetch(`http://localhost:5000/api/tasks/project/${projectId}`, {
    headers: {
      Authorization: "Bearer " + localStorage.getItem("token")
    }
  });

  const tasks = await res.json();

  const container = document.getElementById("taskList");
  container.innerHTML = "";

  tasks.forEach(t => {
    container.innerHTML += `
      <div class="task-card">
        <span>${t.title}</span>
        <span class="status ${t.status}">${t.status}</span>
      </div>
    `;
  });
}

async function createTask() {
  const title = document.getElementById("taskTitle").value;

  await fetch("http://localhost:5000/api/tasks", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: "Bearer " + localStorage.getItem("token")
    },
    body: JSON.stringify({
      title,
      project: projectId
    })
  });

  loadTasks();
}

loadTasks();
</script>

</body>
</html>
