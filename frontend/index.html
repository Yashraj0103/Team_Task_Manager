<!DOCTYPE html>

<html>
<head>
  <title>Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #020617;
      color: white;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* LEFT PANEL */
    .left {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    
    }

    .login-box {
      width: 480px;
      background: #020617;
      border: 1px solid #1e293b;
      padding: 30px;
      border-radius: 12px;
    }

    .login-box h2 {
      margin-bottom: 5px;
    }

    .sub {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* TOGGLE */
    .tabs {
      display: flex;
      background: #0b1220;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      border-radius: 6px;
    }

    .tabs .active {
      background: black;
      color: white;
    }

    /* INPUT */
    label {
      font-size: 13px;
      margin-top: 10px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #0b1220;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #2563eb;
    }

    /* DIVIDER */
    .divider {
      text-align: center;
      color: #94a3b8;
      margin: 15px 0;
      font-size: 13px;
    }

    .google-btn {
      background: black;
      border: 1px solid #1e293b;
    }

    /* RIGHT PANEL */
    .right {
      width: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .hero {
      max-width: 500px;
    }

    .hero h1 {
      font-size: 40px;
    }

    .hero span {
      color: #6366f1;
    }

    .hero p {
      margin-top: 15px;
      color: #94a3b8;
    }

  </style>

</head>

<body>

<div class="container">

  <!-- LEFT AUTH PANEL -->

  <div class="left">
    <div class="login-box">

  <h2>Welcome</h2>
  <p class="sub">Sign in or create an account to continue.</p>

  
  <div class="tabs">
  <button id="loginTab" onclick="showLogin()" class="active">Sign in</button>
  <button id="signupTab" onclick="showSignup()">Create account</button>
</div>


  <div id="loginForm">
    <label>Email</label>
    <input id="loginEmail" placeholder="Enter email">

    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="Enter password">

    <button onclick="login()">Sign in</button>
  </div>

  
  <div id="signupForm" style="display:none;">
  <input id="signupName" placeholder="Name">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password" placeholder="Password">

  <button onclick="signup()">Create account</button>
</div>

  <div class="divider">OR</div>

  <button class="google-btn">Continue with Google</button>

</div>

  </div>



  <div class="right">
    <div class="hero">
      <h1>Plan, track and ship work <span>together.</span></h1>
      <p>
        Projects, teams, tasks and progress in one minimal dashboard
        built for focused teams.
      </p>
    </div>
  </div>

</div>

<script>

const loginTab = document.getElementById("loginTab");
const signupTab = document.getElementById("signupTab");

function showLogin() {
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("signupForm").style.display = "none";

  loginTab.classList.add("active");
  signupTab.classList.remove("active");
}

function showSignup() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "block";

  signupTab.classList.add("active");
  loginTab.classList.remove("active");
}

function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    alert("Please enter email and password");
    return;
  }

  fetch("http://localhost:5000/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  })
  .then(async res => {
    const data = await res.json();

    console.log("STATUS:", res.status);
    console.log("RESPONSE:", data);

    if (!res.ok) {
      alert(data.msg || "Login failed");
      return;
    }

    if (!data.token) {
      alert("No token received from backend");
      return;
    }

    localStorage.setItem("token", data.token);

    console.log("Token saved:", data.token);

    window.location.href = "dashboard.html";
  })
  .catch(err => {
    console.error(err);
    alert("Server error");
  });
}

function signup() {
  const name = document.getElementById("signupName").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  fetch("http://localhost:5000/api/auth/signup", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, email, password })
  })
  .then(res => res.json())
  .then(data => {
    console.log("Signup:", data);
    alert("Signup successful ✅");

    showLogin(); // switch back
  })
  .catch(err => {
    console.error(err);
    alert("Signup failed ❌");
  });
}

</script>

</body>
</html>
