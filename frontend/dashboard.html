<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">Task Manager</div>

    <ul>
      <li class="active">Dashboard</li>
      <li onclick="go('projects.html')">Projects</li>
      <li onclick="go('tasks.html')">My Tasks</li>
      <li onclick="go('team.html')">Team</li>
    </ul>

    

    <div class="user">
  <div class="avatar">Y</div>
  <div>
    <strong>john doe</strong><br>
    <small>john doe@gmail.com</small>
  </div>
</div>

<button class="logout-btn" onclick="logout()">
  Logout →
</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    

    <!-- HEADER -->
    <div class="header">
      <div>
        <h1>Dashboard</h1>
        <p class="sub">Overview of your projects and tasks.</p>
      </div>

      <button class="primary-btn" onclick="go('projects.html')">
  + New project
</button>
    </div>

    <!-- STATS -->
    <div class="stats">

  <div class="card">
    <div class="card-header">
      <span>Total Tasks</span>
      <div class="icon"></div>
    </div>
    <h2 id="totalTasks">0</h2>
  </div>

  <div class="card">
    <div class="card-header">
      <span>In Progress</span>
      <div class="icon blue"></div>
    </div>
    <h2 id="inProgressTasks">0</h2>
  </div>

  <div class="card">
    <div class="card-header">
      <span>Completed</span>
      <div class="icon green"></div>
    </div>
    <h2 id="doneTasks">0</h2>
  </div>

  <div class="card">
    <div class="card-header">
      <span>Overdue</span>
      <div class="icon red"></div>
    </div>
    <h2 id="overdueTasks">0</h2>
  </div>

</div>

    <!-- GRID -->
    <div class="grid">

      <!-- TASKS -->
      <div class="panel">
        <div class="panel-header">
          <h3>My tasks</h3>
          <span class="link" onclick="go('tasks.html')">View all</span>
        </div>

        <div class="empty">
          No tasks assigned to you yet.
        </div>
      </div>

      <!-- PROJECTS -->
      <div class="panel">
        <div class="panel-header">
          <h3>Projects</h3>
          <span class="link" onclick="go('projects.html')">All</span>
        </div>

        <div class="empty">
          Create your first project.
        </div>
      </div>

    </div>

  </div>

</div>

<script>
function go(page){
  window.location.href = page;
}
function logout() {
  localStorage.removeItem("token");
  window.location.href = "index.html"; // your login page
}
</script>

</body>
</html>
